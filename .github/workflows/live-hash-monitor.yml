name: Live artifact hash monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read expected hashes from this private repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github.raw+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/monitor/expected-hashes.json?ref=${GITHUB_SHA}" \
            --output /tmp/bitcard-expected-hashes.json

      - name: Verify production and mirror bytes
        run: |
          python3 - <<'PY'
          import hashlib, json, sys, urllib.request

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Bitcard-live-hash-monitor/1"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          with open("/tmp/bitcard-expected-hashes.json", "r", encoding="utf-8") as handle:
              cfg = json.load(handle)
          failures = []
          for url in cfg["urls"]:
              name = url.rsplit("/", 1)[-1]
              actual = hashlib.sha256(fetch(url)).hexdigest()
              expected = cfg["artifacts"].get(name)
              print(f"{url} {actual}")
              if not expected or actual != expected.lower():
                  failures.append(f"{url}: {actual} != {expected}")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(2)
          print(f"all {len(cfg['urls'])} URLs match release {cfg['builtFromCommit']}")
          PY
